services:
  radarr:
    build: .
    image: local/radarr-fallback:dev
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - C:/docker/radarr-test/config:/config
      - G:/Torrent:/downloads
      - G:/Plex/Peliculas:/movies
    ports:
      - 7878:7878
    restart: always
